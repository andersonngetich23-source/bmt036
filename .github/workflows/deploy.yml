name: Deploy White-Label dTrader
on:
  push:
    branches: [master, main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Build White-Label dTrader
        run: pnpm run build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          VITE_PUBLIC_PATH: /bmt036/
          PUBLIC_PATH: /bmt036/

      - name: Find dist folder
        run: |
          ls -la
          find . -type d -name "dist" | head -20
          echo "--- packages ---"
          ls packages/ || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
