name: Deploy White-Label dTrader
on:
  push:
    branches: [master, main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Build White-Label dTrader
        run: pnpm run build:all
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          VITE_PUBLIC_PATH: /bmt036/
          PUBLIC_PATH: /bmt036/

      - name: Find dist folder
        run: |
          echo "Finding dist..."
          find . -type d -name "dist" -o -name "build" | grep -E "dist|build" | head -30
          ls -la ./dist 2|| true
          ls -la ./packages/*/dist 2|| true
          ls -la ./packages/trader/dist 2|| true

      - name: Upload Pages
        uses: actions/upload-pages-artifact@v3
        with:
          # Most white-label templates output to packages/trader/dist or dist
          path: ./packages/trader/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
