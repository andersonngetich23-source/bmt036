name: Deploy dTrader White-Label
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install with NPM
        run: npm install

      - name: Build
        run: npm run build:all
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          CI: false

      - name: Find build output
        id: find
        run: |
          echo "Searching build..."
          find. -type f -name "index.html" | grep -v node_modules | head -20
          DIR=$(find. -path "*/trader/dist" -type d | head -n 1)
          if [ -z "$DIR" ]; then
            DIR=$(find. -path "*/dist" -type d | grep trader | head -n 1)
          fi
          if [ -z "$DIR" ]; then
            DIR=$(find packages -name "dist" -type d | head -n 1)
          fi
          if [ -z "$DIR" ]; then
            DIR="./dist"
          fi
          echo "Using DIR=$DIR"
          echo "dir=$DIR" >> $GITHUB_OUTPUT
          ls -lh "$DIR" | head -30

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.find.outputs.dir }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
