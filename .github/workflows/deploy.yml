name: Deploy dTrader White-Label
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm install
      - run: npm run build:all
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          CI: false
      - name: Find and prepare site
        run: |
          echo "=== Listing all dist ==="
          ls -R packages/*/dist 2>/dev/null | head -n 100
          echo "=== Searching index.html ==="
          find. -type f -name "index.html" | grep -E "/dist/" | grep -v node_modules
          SRC=$(find. -type f -name "index.html" | grep -E "/dist/" | grep -v node_modules | head -n 1 | xargs dirname)
          echo "Found SRC=$SRC"
          if [ -z "$SRC" ]; then
            echo "No dist found! trying./dist"
            SRC=./dist
          fi
          mkdir -p./site
          cp -r $SRC/*./site/
          cp -r $SRC/.*./site/ 2>/dev/null || true
          ls -lh./site/
          test -f./site/index.html && echo "index.html FOUND" || echo "index.html MISSING"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
