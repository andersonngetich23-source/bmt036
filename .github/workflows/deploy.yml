name: Deploy dTrader White-Label
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm install
      - run: npm run build:all
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          CI: false
      - name: Prepare site
        run: |
          ls packages/trader/dist || true
          ls packages/core/dist || true
          mkdir -p./site
          if [ -f packages/trader/dist/index.html ]; then
            cp -r packages/trader/dist/*./site/
          elif [ -f packages/core/dist/index.html ]; then
            cp -r packages/core/dist/*./site/
          else
            SRC=$(ls -d packages/*/dist | head -n 1)
            cp -r $SRC/*./site/
          fi
          ls -lh./site/
          ls./site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
